name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "crates/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy -- -D warnings
