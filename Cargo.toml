[package]
name = "fyro_db"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false

[dependencies]
customhash = { path = "crates/customhash" }
num_cpus = "1.17.0"
socket2 = { version = "0.6.5", features = ["all"] }
mio = { version = "1.2.2", features = ["net", "os-poll"] }
memchr = "2.8.3"
mimalloc = { version = "0.1.52", default-features = false }
libc = "0.2.186"
crossbeam-queue = "0.3.13"
foldhash = "0.2.0"
