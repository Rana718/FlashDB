[package]
name = "flash_db"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
dashmap = "6.2.1"
num_cpus = "1.17.0"
socket2 = { version = "0.6.5", features = ["all"] }
mio = { version = "1.2.2", features = ["net", "os-poll"] }
memchr = "2.8.3"
smallvec = "1.15.2"
mimalloc = { version = "0.1.52", default-features = false }
libc = "0.2.186"