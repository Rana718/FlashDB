  cluster-init:
    image: redis:alpine
    container_name: cluster-init
    depends_on:
      - redis-1
      - redis-2
      - redis-3
      - redis-4
      - redis-5
      - redis-6
    networks:
      - redis-cluster-net
    entrypoint: >
      sh -c "
        sleep 3 &&
        redis-cli --cluster create
          172.20.0.11:7001
          172.20.0.12:7002
          172.20.0.13:7003
          172.20.0.14:7004
          172.20.0.15:7005
          172.20.0.16:7006
          --cluster-replicas 0
          --cluster-yes
      "
    restart: "no"

networks:
  redis-cluster-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
