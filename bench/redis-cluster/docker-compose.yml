services:
  redis-1:
    image: redis:alpine
    container_name: redis-1
    command: >
      redis-server
      --port 7001
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --save ""
      --appendonly no
      --hz 100
      --dynamic-hz yes
      --tcp-backlog 511
      --tcp-keepalive 0
      --timeout 0
      --maxmemory-policy noeviction
      --lazyfree-lazy-eviction yes
      --lazyfree-lazy-expire yes
      --lazyfree-lazy-server-del yes
      --no-appendfsync-on-rewrite yes
      --activerehashing yes
      --activedefrag no
      --loglevel warning
    ports:
      - "7001:7001"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      redis-cluster-net:
        ipv4_address: 172.20.0.11

  redis-2:
